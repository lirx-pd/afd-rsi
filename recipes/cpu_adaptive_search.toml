name = "Synthetic controller demonstration"
backend = "cpu-synthetic"
source = "../examples/source"
workload_id = "cpu-fixture-v1"
scope = "synthetic-controller-only"
unit = "synthetic_us"
metric = "synthetic_latency"
ranks = 2
primary_rank = 0
repetitions = 4
timeout_seconds = 10
# Wall time is a safety cap, not a schedule. A campaign is expected to run for
# hours while its status is polled, so raise this rather than restarting a run.
budget_seconds = 3600
min_gain_pct = 2.0
allowed_files = ["kernel.json"]
artifacts = ["kernel.json"]

[commands]
build = ["{python}", "{foundation}/benchmarks/fixtures/cpu_driver.py", "build"]
correctness = ["{python}", "{foundation}/benchmarks/fixtures/cpu_driver.py", "correctness"]
benchmark = ["{python}", "{foundation}/benchmarks/fixtures/cpu_driver.py", "benchmark"]

[search]
policy = "adaptive-v1"
max_model_calls = 36
# Proposer model: codex (default) or deepseek. Switching this one line selects the
# frozen adapter; the controller still validates every proposal the same way.
provider = "codex"
agent_command = ["{python}", "{foundation}/benchmarks/agents/codex_agent.py", "--request", "{request}", "--output", "{response}"]
max_rounds = 9
max_calls = 9
agent_timeout_seconds = 180
max_context_bytes = 131072
experience_dirs = []

# Direction routing: category abilities are estimated from measured gain, not raw
# trial counts. Exploration stays off (info_floor = 0) until a campaign has
# enough rounds for the estimate to mean anything.
router = "auto"
info_floor = 0.0
margin = 0.02
explore_max_fraction = 0.25

[search.features]
# Frozen difficulty weights (CAKE Eq.1 ordering): tiling, scheduling, blocking,
# reduction, dtype spread, data movement, fusion breadth, cube intensity.
weights = { T = 0.51, S = 0.78, B = 0.59, R = 0.70, D = 0.44, M = 0.61, F = 0.64, C = 0.98 }

# DeepSeek only: per-stage proposer models, frozen into the plan and carried in the
# request. Both default to DeepSeek-V4.1-Flash-1017; replace one line when a new model
# is better at analysis or at coding. The gateway address and the credential variable
# are environment, never recipe: run `python -m afd_rsi probe` first. Uncomment as a
# separate table at the end of this file:
# [search.models]
# analysis = "DeepSeek-V4.1-Flash-1017"
# code = "DeepSeek-V4.1-Flash-1017"
