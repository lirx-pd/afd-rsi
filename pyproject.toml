[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afd-rsi"
version = "0.1.0"
description = "Local evidence-driven MegaMoe optimization workbench"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
service = ["httpx>=0.27"]
eval = ["httpx>=0.27", "lm_eval[api]==0.4.12", "datasets==4.4.1", "pyarrow==21.0.0", "PyYAML>=6"]

[project.scripts]
afd-rsi = "afd_rsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
