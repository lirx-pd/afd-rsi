[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afd-rsi"
version = "0.1.0"
description = "Local evidence-driven MegaMoe optimization workbench"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
afd-rsi = "afd_rsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
